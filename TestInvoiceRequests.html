<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <title>Test Invoice Requests</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/css/tabulator_bootstrap5.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        font-size: 0.8rem;
      }

      .main-content {
        flex-grow: 1;
        padding: 20px;
      }

      .test-invoice-toolbar .btn {
        border-radius: 25px;
        font-weight: 600;
      }

      #save-test-invoice-requests {
        border-color: transparent;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      #test-invoice-requests-table {
        min-height: 240px;
        font-size: 0.78rem;
      }

      #test-invoice-requests-table .tabulator-col-content {
        height: 76px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        padding: 8px 7px 5px;
      }

      #test-invoice-requests-table .tabulator-col-title {
        white-space: normal;
        overflow-wrap: anywhere;
        text-align: center;
        font-weight: 700;
      }

      #test-invoice-requests-table .tabulator-col-title-holder {
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #test-invoice-requests-table .tabulator-header-filter {
        width: 100%;
        margin-top: auto;
      }

      #test-invoice-requests-table .tabulator-header-filter input {
        width: 100%;
        padding: 2px 4px;
        font-size: 0.72rem;
      }

      #test-invoice-requests-table .tabulator-cell {
        min-height: 34px;
        padding: 5px 7px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        vertical-align: middle;
      }

      #test-invoice-requests-table .tabulator-cell.invoice-checkbox-cell {
        text-align: center;
        font-size: 1.05rem;
      }

      #test-invoice-requests-table .tabulator-cell.scrollable-text-cell {
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        white-space: pre;
        text-overflow: clip;
        scrollbar-width: thin;
      }

      #test-invoice-requests-table
        .tabulator-cell.scrollable-text-cell
        .request-cell-content {
        display: inline-block;
        min-width: max-content;
        white-space: pre;
      }

      #test-invoice-requests-table
        .tabulator-cell.invoice-checkbox-cell.is-unchecked {
        background: #fff;
        color: #74797d;
      }

      #test-invoice-requests-table
        .tabulator-cell.invoice-checkbox-cell.is-checked {
        background: #fff;
        color: #74797d;
      }

      #test-invoice-requests-table
        .tabulator-cell.invoice-checkbox-cell.is-not-applicable {
        background: #d9ead3;
        color: #4f772d;
      }

      #test-invoice-requests-table .tabulator-cell.is-dirty {
        position: relative;
        z-index: 1;
        box-shadow:
          inset 0 0 0 3px #ff8c00,
          inset 0 0 0 4px #fff3cd;
      }

      #save-test-invoice-requests.has-unsaved {
        animation: unsaved-save-pulse 1.4s ease-in-out infinite;
        box-shadow: 0 0 0 4px rgba(255, 140, 0, 0.3);
      }

      #test-invoice-requests-table .request-link {
        color: #3976c6;
        text-decoration: underline;
      }

      .save-status {
        min-width: 150px;
        padding: 0.3rem 0.55rem;
        border: 2px solid transparent;
        border-radius: 8px;
        color: #6c757d;
        text-align: right;
      }

      .save-status.unsaved {
        border-color: #ff8c00;
        background: #fff3cd;
        color: #8a4b00;
        font-weight: 700;
      }

      .save-status.error {
        color: #dc3545;
      }

      .save-status.success {
        color: #198754;
      }

      @keyframes unsaved-save-pulse {
        50% {
          transform: translateY(-1px);
          box-shadow: 0 0 0 7px rgba(255, 140, 0, 0.14);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #save-test-invoice-requests.has-unsaved {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <?!= getNavigation(activePage) ?>

    <main class="main-content container-fluid">
      <div
        class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3"
      >
        <div>
          <h2 class="mb-1">Test Invoice Requests</h2>
          <div class="text-muted">Tabulator test · source: анкета, columns B–M</div>
        </div>
        <div class="test-invoice-toolbar d-flex align-items-center gap-2">
          <span id="test-invoice-save-status" class="save-status" aria-live="polite"></span>
          <button
            type="button"
            id="reload-test-invoice-requests"
            class="btn btn-outline-secondary"
          >
            <i class="bi bi-arrow-clockwise me-1"></i>Reload
          </button>
          <button
            type="button"
            id="save-test-invoice-requests"
            class="btn btn-primary"
            disabled
          >
            <i class="bi bi-floppy me-1"></i>Save changes
          </button>
        </div>
      </div>

      <div
        id="test-invoice-load-error"
        class="alert alert-danger d-none"
        role="alert"
      ></div>
      <div
        id="test-invoice-requests-table"
        aria-label="Test invoice requests"
      ></div>
    </main>

    <div
      class="modal fade"
      id="unsavedChangesModal"
      tabindex="-1"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      aria-labelledby="unsavedChangesModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-warning border-3">
          <div class="modal-header bg-warning-subtle">
            <h5 class="modal-title" id="unsavedChangesModalLabel">
              Unsaved changes
            </h5>
          </div>
          <div class="modal-body fs-6">
            There are unsaved changes. Do you want to leave without saving?
          </div>
          <div class="modal-footer">
            <button
              type="button"
              id="stay-with-unsaved-changes"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              No, stay
            </button>
            <button
              type="button"
              id="leave-with-unsaved-changes"
              class="btn btn-danger"
            >
              Yes, leave
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var tableElement = document.getElementById(
          "test-invoice-requests-table"
        );
        var saveButton = document.getElementById(
          "save-test-invoice-requests"
        );
        var reloadButton = document.getElementById(
          "reload-test-invoice-requests"
        );
        var statusElement = document.getElementById(
          "test-invoice-save-status"
        );
        var errorElement = document.getElementById("test-invoice-load-error");
        var unsavedModalElement = document.getElementById(
          "unsavedChangesModal"
        );
        var leaveWithoutSavingButton = document.getElementById(
          "leave-with-unsaved-changes"
        );
        var unsavedModal = new bootstrap.Modal(unsavedModalElement);
        var table = null;
        var dirtyChanges = {};
        var isSaving = false;
        var allowUnsavedExit = false;
        var pendingDiscardAction = null;
        var tableTopOffset = tableElement.getBoundingClientRect().top;
        var headerColors = [
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#dbe8fb",
          "#dbe8fb",
          "#efc2c8",
          "#efc2c8",
          "#efc2c8",
          "#dcebd5",
          "#dcebd5",
          "#dcebd5",
        ];
        var fallbackHeaders = [
          "PM",
          "Проект",
          "Дані",
          "Комент",
          "Инв",
          "Файл зад.",
          "XERO",
          "подр",
          "Repassage",
          "Отпр.инв",
          "Проекты",
          "Оп.б",
        ];
        var textColumnWidths = [138, 138, 215, 180];

        function tableHeight() {
          return Math.max(240, window.innerHeight - tableTopOffset - 20);
        }

        function changeKey(id, columnOffset) {
          return id + "::" + columnOffset;
        }

        function dirtyCount() {
          return Object.keys(dirtyChanges).length;
        }

        function setStatus(message, type) {
          statusElement.textContent = message || "";
          statusElement.className =
            "save-status" + (type ? " " + type : "");
        }

        function updateToolbar() {
          var count = dirtyCount();
          saveButton.disabled = isSaving || count === 0;
          reloadButton.disabled = isSaving;
          saveButton.classList.toggle("has-unsaved", count > 0);
          if (!isSaving && count > 0) {
            setStatus(
              count + (count === 1 ? " unsaved change" : " unsaved changes"),
              "unsaved"
            );
          }
        }

        function textFormatter(cell) {
          var value = cell.getValue();
          var row = cell.getRow().getData();
          var columnOffset = Number(cell.getColumn().getField().substring(1));
          var link = row._links[columnOffset] || "";
          var displayValue =
            value === null || value === undefined ? "" : String(value);
          if (!link) {
            var text = document.createElement("span");
            text.className = "request-cell-content";
            text.textContent = displayValue;
            return text;
          }

          var anchor = document.createElement("a");
          anchor.href = link;
          anchor.target = "_blank";
          anchor.rel = "noopener";
          anchor.className = "request-link request-cell-content";
          anchor.textContent =
            row["_display" + columnOffset] || displayValue || link;
          anchor.addEventListener("click", function (event) {
            event.stopPropagation();
          });
          return anchor;
        }

        function checkboxFormatter(cell) {
          var status = cell.getValue();
          if (status === true) status = "checked";
          if (status === false || status === "") status = "unchecked";
          var element = cell.getElement();
          element.classList.toggle("is-checked", status === "checked");
          element.classList.toggle("is-unchecked", status === "unchecked");
          element.classList.toggle(
            "is-not-applicable",
            status === "notApplicable"
          );

          var icon = document.createElement("i");
          if (status === "checked") {
            icon.className = "bi bi-check-square-fill";
            icon.setAttribute("aria-label", "Checked");
            icon.title = "Checked";
          } else if (status === "notApplicable") {
            icon.className = "bi bi-dash-square-fill";
            icon.setAttribute("aria-label", "Not applicable");
            icon.title = "Not applicable";
          } else {
            icon.className = "bi bi-square";
            icon.setAttribute("aria-label", "Unchecked");
            icon.title = "Unchecked";
          }
          return icon;
        }

        function buildColumns(headers) {
          return fallbackHeaders.map(function (fallbackHeader, columnOffset) {
            var header = headers[columnOffset] || fallbackHeader;
            var checkboxColumn = columnOffset >= 4;
            var column = {
              title: header,
              field: "c" + columnOffset,
              headerHozAlign: "center",
              headerSort: true,
              editable: !checkboxColumn,
              minWidth: checkboxColumn
                ? 66
                : textColumnWidths[columnOffset],
              width: checkboxColumn ? 70 : textColumnWidths[columnOffset],
              variableHeight: !checkboxColumn,
              cssClass: checkboxColumn
                ? "invoice-checkbox-cell"
                : columnOffset === 2 || columnOffset === 3
                ? "scrollable-text-cell"
                : "",
              formatter: checkboxColumn ? checkboxFormatter : textFormatter,
              editor: checkboxColumn ? false : "textarea",
              editorParams: checkboxColumn
                ? {
                    tristate: false,
                  }
                : {
                    verticalNavigation: "table",
                    shiftEnterSubmit: true,
                  },
              headerFilter: checkboxColumn ? false : "input",
              headerFilterPlaceholder: "Search",
              headerSortTristate: true,
            };

            if (checkboxColumn) {
              column.cellClick = function (event, cell) {
                event.preventDefault();
                var currentStatus = cell.getValue();
                var nextStatus =
                  currentStatus === "unchecked"
                    ? "checked"
                    : currentStatus === "checked"
                    ? "notApplicable"
                    : "unchecked";
                cell.setValue(nextStatus);
                trackCellChange(cell);
              };
            }
            if (columnOffset === 0) column.frozen = true;
            return column;
          });
        }

        function tableRows(response) {
          return (response.rows || []).map(function (sourceRow) {
            var row = {
              _id: sourceRow.id,
              _links: [],
              _original: [],
              _originalTokens: [],
            };
            (sourceRow.cells || []).forEach(function (cell, columnOffset) {
              row["c" + columnOffset] = cell.value;
              row["_display" + columnOffset] = cell.displayValue;
              row._links[columnOffset] = cell.link || "";
              row._original[columnOffset] = cell.value;
              row._originalTokens[columnOffset] = cell.originalToken;
            });
            return row;
          });
        }

        function applyHeaderColors() {
          if (!table) return;
          table.getColumns().forEach(function (column, index) {
            column.getElement().style.backgroundColor =
              headerColors[index] || "#f1f3f5";
          });
        }

        function buildTable(response) {
          if (table) table.destroy();
          tableTopOffset = tableElement.getBoundingClientRect().top;
          table = new Tabulator(tableElement, {
            index: "_id",
            height: tableHeight(),
            layout: "fitColumns",
            editTriggerEvent: "dblclick",
            placeholder: "No invoice requests found",
            columns: buildColumns(response.headers || []),
            data: tableRows(response),
            rowFormatter: function (row) {
              row.getElement().style.minHeight = "34px";
            },
          });
          table.on("tableBuilt", applyHeaderColors);
          table.on("cellEdited", trackCellChange);
        }

        function trackCellChange(cell) {
          var row = cell.getRow().getData();
          var columnOffset = Number(cell.getColumn().getField().substring(1));
          var originalValue = row._original[columnOffset];
          var currentValue = cell.getValue();
          var key = changeKey(row._id, columnOffset);
          var changed =
            JSON.stringify(currentValue) !== JSON.stringify(originalValue);

          if (changed) {
            dirtyChanges[key] = {
              id: row._id,
              columnOffset: columnOffset,
              originalToken: row._originalTokens[columnOffset],
              value: currentValue,
            };
          } else {
            delete dirtyChanges[key];
          }
          cell.getElement().classList.toggle("is-dirty", changed);
          if (columnOffset >= 4) checkboxFormatter(cell);
          updateToolbar();
        }

        function setLoading(loading) {
          reloadButton.disabled = loading || isSaving;
          reloadButton.querySelector("i").className = loading
            ? "spinner-border spinner-border-sm me-1"
            : "bi bi-arrow-clockwise me-1";
        }

        function loadData(force) {
          if (dirtyCount() > 0 && !force) return;
          setLoading(true);
          errorElement.classList.add("d-none");
          errorElement.textContent = "";
          setStatus("Loading…");

          google.script.run
            .withSuccessHandler(function (response) {
              dirtyChanges = {};
              buildTable(response || { headers: [], rows: [] });
              setLoading(false);
              setStatus("");
              updateToolbar();
            })
            .withFailureHandler(function (error) {
              console.error("Test Invoice Requests load failed:", error);
              errorElement.textContent =
                (error && error.message) || "Failed to load invoice requests.";
              errorElement.classList.remove("d-none");
              setLoading(false);
              setStatus("Load failed", "error");
            })
            .getTestInvoiceRequests();
        }

        function saveChanges() {
          var changes = Object.keys(dirtyChanges).map(function (key) {
            return dirtyChanges[key];
          });
          if (changes.length === 0 || isSaving) return;

          isSaving = true;
          saveButton.querySelector("i").className =
            "spinner-border spinner-border-sm me-1";
          setStatus("Saving…");
          updateToolbar();

          google.script.run
            .withSuccessHandler(function (result) {
              isSaving = false;
              saveButton.querySelector("i").className = "bi bi-floppy me-1";
              if (!result || !result.success) {
                updateToolbar();
                setStatus(
                  (result && result.message) || "Save failed",
                  "error"
                );
                return;
              }

              dirtyChanges = {};
              setStatus("Saved", "success");
              updateToolbar();
              loadData(true);
            })
            .withFailureHandler(function (error) {
              console.error("Test Invoice Requests save failed:", error);
              isSaving = false;
              saveButton.querySelector("i").className = "bi bi-floppy me-1";
              updateToolbar();
              setStatus(
                (error && error.message) || "Save failed. Try again.",
                "error"
              );
            })
            .saveTestInvoiceRequestChanges(changes);
        }

        function confirmDiscard(action) {
          if (dirtyCount() === 0) {
            action();
            return;
          }
          pendingDiscardAction = action;
          unsavedModal.show();
        }

        saveButton.addEventListener("click", saveChanges);
        reloadButton.addEventListener("click", function () {
          confirmDiscard(function () {
            loadData(true);
          });
        });

        leaveWithoutSavingButton.addEventListener("click", function () {
          var action = pendingDiscardAction;
          pendingDiscardAction = null;
          unsavedModal.hide();
          if (action) action();
        });

        document.addEventListener(
          "click",
          function (event) {
            if (dirtyCount() === 0) return;
            var link = event.target.closest("a[href]");
            if (
              !link ||
              link.classList.contains("request-link") ||
              link.target === "_blank" ||
              link.getAttribute("href").charAt(0) === "#"
            ) {
              return;
            }

            event.preventDefault();
            event.stopImmediatePropagation();
            var destination = link.href;
            confirmDiscard(function () {
              allowUnsavedExit = true;
              window.top.location.href = destination;
            });
          },
          true
        );

        unsavedModalElement.addEventListener("hidden.bs.modal", function () {
          pendingDiscardAction = null;
        });

        window.addEventListener("beforeunload", function (event) {
          if (dirtyCount() === 0 || allowUnsavedExit) return;
          event.preventDefault();
          event.returnValue = "";
        });

        window.addEventListener("resize", function () {
          if (table) table.setHeight(tableHeight());
        });

        loadData(true);
      });
    </script>
  </body>
</html>
