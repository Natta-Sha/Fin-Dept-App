      #invoice-requests-table .tabulator-col.status-group-boundary,
      #invoice-requests-table .tabulator-cell.status-group-boundary {
        border-left: 1px solid #dee2e6;
      }

      /* Frozen cells must stay opaque while scrolling under them. */
      #invoice-requests-table .tabulator-cell.tabulator-frozen {
        background-color: inherit;
      }

      #invoice-requests-table .tabulator-cell.invoice-checkbox-cell {
        text-align: center;
        font-size: 1.05rem;
      }

      #invoice-requests-table .tabulator-cell.scrollable-text-cell {
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        white-space: pre;
        text-overflow: clip;
        scrollbar-width: thin;
      }

      #invoice-requests-table
        .tabulator-cell.scrollable-text-cell
        .request-cell-content {
        display: inline-block;
        min-width: max-content;
        white-space: pre;
      }

      #invoice-requests-table
        .tabulator-cell.invoice-checkbox-cell.is-unchecked,
      #invoice-requests-table
        .tabulator-cell.invoice-checkbox-cell.is-checked {
        background-color: inherit;
        color: #74797d;
      }

      #invoice-requests-table
        .tabulator-cell.invoice-checkbox-cell.is-not-applicable {
        background: #d9ead3;
        color: #4f772d;
      }

      #invoice-requests-table .tabulator-cell.is-dirty {
        position: relative;
        z-index: 1;
        box-shadow:
          inset 0 0 0 3px #ff8c00,
          inset 0 0 0 4px #fff3cd;
      }

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var tableElement = document.getElementById(
          "invoice-requests-table"
        );
        var saveButton = document.getElementById(
          "save-invoice-requests"
        );
        var addRowButton = document.getElementById(
          "add-invoice-request"
        );
        var reloadButton = document.getElementById(
          "reload-invoice-requests"
        );
        var statusElement = document.getElementById(
          "invoice-save-status"
        );
        var errorElement = document.getElementById("invoice-load-error");
        var mobileListElement = document.getElementById(
          "invoice-mobile-list"
        );
        var mobileFormElement = document.getElementById(
          "invoice-mobile-form"
        );
        var mobileFormTitle = document.getElementById(
          "invoice-mobile-form-title"
        );
        var mobileProjectField = document.getElementById(
          "mobile-field-project"
        );
        var mobileDetailsField = document.getElementById(
          "mobile-field-details"
        );
        var mobileCommentField = document.getElementById(
          "mobile-field-comment"
        );
        var mobileFormSaveButton = document.getElementById(
          "mobile-form-save"
        );
        var mobileFormCancelButton = document.getElementById(
          "mobile-form-cancel"
        );
        var desktopProjectField = document.getElementById(
          "desktop-field-project"
        );
        var desktopDetailsField = document.getElementById(
          "desktop-field-details"
        );
        var desktopCommentField = document.getElementById(
          "desktop-field-comment"
        );
        var createInvoiceSaveButton = document.getElementById(
          "create-invoice-save"
        );
        var createInvoiceCancelButton = document.getElementById(
          "create-invoice-cancel"
        );
        var createInvoiceDismissButton = document.getElementById(
          "create-invoice-dismiss"
        );
        var createInvoiceModalElement = document.getElementById(
          "createInvoiceRequestModal"
        );
        var createInvoiceModal = new bootstrap.Modal(
          createInvoiceModalElement
        );
        var unsavedModalElement = document.getElementById(
          "unsavedChangesModal"
        );
        var leaveWithoutSavingButton = document.getElementById(
          "leave-with-unsaved-changes"
        );
        var unsavedModal = new bootstrap.Modal(unsavedModalElement);
        var table = null;
        var dirtyChanges = {};
        var isSaving = false;
        var draftRowId = null;
        var allowUnsavedExit = false;
        var pendingDiscardAction = null;
        // Set false to restore the previous inline table-row create flow.
        var USE_DESKTOP_CREATE_OVERLAY = true;
        var desktopCreateOpen = false;
        var desktopCreateBaseline = null;
        var tableTopOffset = tableElement.getBoundingClientRect().top;
        var headerColors = [
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
          "#f1f3f5",
        ];
        var fallbackHeaders = [
          "Проект",
          "Дані",
          "Комент",
          "Автор",
          "Инв",
          "Файл зад.",
          "XERO",
          "подр",
          "Repassage",
          "Отпр.инв",
          "Проекты",
          "Оп.б",
          "Файл рейтів",
          "Created by",
          "Created at",
          "Edited by",
          "Edited at",
        ];
        var textColumnWidths = {
          0: 138,
          1: 366,
          2: 216,
          3: 138,
          12: 150,
          13: 120,
          14: 140,
          15: 120,
          16: 140,
        };
        var STATUS_FIRST_OFFSET = 4;
        var STATUS_LAST_OFFSET = 11;
        // Left edges: start of checkboxes, between former color groups, after checkboxes.
        var STATUS_GROUP_BOUNDARY_OFFSETS = [4, 6, 9, 12];
        var PROJECT_OFFSET = 0;
        var DETAILS_OFFSET = 1;
        var COMMENT_OFFSET = 2;
        var AUTHOR_OFFSET = 3;
        var RATE_FILE_OFFSET = 12;
        var CREATED_AT_OFFSET = 14;
        var EDITED_AT_OFFSET = 16;
        var projectOptions = [];
        var showStatusColumns = true;
        var showAuthorColumn = true;
        var isLimitedAccess = false;
        var lastLoadedResponse = null;
        var mobileFormMode = null;
        var mobileEditRow = null;
        var mobileFormBaseline = null;

        function isStatusColumn(columnOffset) {
          return (
            columnOffset >= STATUS_FIRST_OFFSET &&
            columnOffset <= STATUS_LAST_OFFSET
          );
        }

        function isStatusGroupBoundary(columnOffset) {
          if (showStatusColumns) {
            return (
              STATUS_GROUP_BOUNDARY_OFFSETS.indexOf(columnOffset) !== -1
            );
          }
          // Limited view hides status columns; keep a separator between
          // the data block and Файл рейтів / audit columns.
          return columnOffset === RATE_FILE_OFFSET;
        }

        function isTimestampColumn(columnOffset) {
          return (
            columnOffset === CREATED_AT_OFFSET ||
            columnOffset === EDITED_AT_OFFSET
          );
        }

        function parseDdMmTimestamp(value) {
          var text = String(value || "").trim();
          if (!text) return 0;
          var match = text.match(
            /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/
          );
          if (!match) return 0;
          var day = Number(match[1]);
          var month = Number(match[2]);
          var year = Number(match[3]);
          if (month < 1 || month > 12 || day < 1 || day > 31) return 0;
          var parsed = new Date(
            year,
            month - 1,
            day,
            Number(match[4] || 0),
            Number(match[5] || 0),
            Number(match[6] || 0)
          );
          return isNaN(parsed.getTime()) ? 0 : parsed.getTime();
        }

        function rowActivityAt(row) {
          return (
            parseDdMmTimestamp(row["c" + EDITED_AT_OFFSET]) ||
            parseDdMmTimestamp(row["c" + CREATED_AT_OFFSET]) ||
            Number(row._activityAt) ||
            0
          );
        }

        function ddMmSorter(a, b) {
          return parseDdMmTimestamp(a) - parseDdMmTimestamp(b);
        }

        function isDraftInputColumn(columnOffset) {
          return (
            columnOffset === PROJECT_OFFSET ||
            columnOffset === DETAILS_OFFSET ||
            columnOffset === COMMENT_OFFSET
          );
        }

        function isReadOnlyColumn(columnOffset) {
          return (
            columnOffset === AUTHOR_OFFSET || columnOffset >= RATE_FILE_OFFSET
          );
        }

        function tableHeight() {
          return Math.max(240, window.innerHeight - tableTopOffset - 20);
        }

        function changeKey(id, columnOffset) {
          return id + "::" + columnOffset;
        }

        function dirtyCount() {
          return Object.keys(dirtyChanges).length;
        }

        function hasDraftRow() {
          return draftRowId !== null;
        }

        function hasOpenCreateOrEditForm() {
          return !!mobileFormMode || desktopCreateOpen;
        }

        function isDesktopCreateDirty() {
          if (!desktopCreateOpen || !desktopCreateBaseline) return false;
          return (
            String(desktopProjectField.value || "") !==
              String(desktopCreateBaseline.project || "") ||
            String(desktopDetailsField.value || "") !==
              String(desktopCreateBaseline.details || "") ||
            String(desktopCommentField.value || "") !==
              String(desktopCreateBaseline.comment || "")
          );
        }

        function isMobileFormDirty() {
          if (!mobileFormMode || !mobileFormBaseline) return false;
          return (
            String(mobileProjectField.value || "") !==
              String(mobileFormBaseline.project || "") ||
            String(mobileDetailsField.value || "") !==
              String(mobileFormBaseline.details || "") ||
            String(mobileCommentField.value || "") !==
              String(mobileFormBaseline.comment || "")
          );
        }

        function hasUnsavedWork() {
          return (
            dirtyCount() > 0 ||
            draftRowId !== null ||
            (mobileFormMode && isMobileFormDirty()) ||
            (desktopCreateOpen && isDesktopCreateDirty())
          );
        }

        function getViewportWidth_() {
          var width =
            window.innerWidth || document.documentElement.clientWidth || 0;
          if (window.visualViewport && window.visualViewport.width) {
            width = Math.min(width, window.visualViewport.width);
          }
          return width;
        }

        function isMobileUserAgent_() {
          // Chrome device mode spoofs UA; Apps Script iframes often keep a
          // wide innerWidth, so UA is more reliable than matchMedia alone.
          return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(
            String(navigator.userAgent || "")
          );
        }

        function useMobileLimitedUi() {
          if (!isLimitedAccess) return false;
          if (isMobileUserAgent_()) return true;
          return getViewportWidth_() <= 768;
        }

        function setStatus(message, type) {
          statusElement.textContent = message || "";
          statusElement.className =
            "save-status" + (type ? " " + type : "");
        }

        function updateToolbar() {
          var count = dirtyCount();
          var mobileUi = useMobileLimitedUi();
          var formOpen = hasOpenCreateOrEditForm();
          saveButton.disabled = isSaving || count === 0;
          reloadButton.disabled = isSaving;
          addRowButton.disabled =
            isSaving || count > 0 || hasDraftRow() || formOpen;
          saveButton.classList.toggle("has-unsaved", count > 0);
          if (!isSaving && mobileFormMode === "edit" && isMobileFormDirty()) {
            setStatus("Unsaved changes", "unsaved");
          } else if (
            !isSaving &&
            desktopCreateOpen &&
            isDesktopCreateDirty()
          ) {
            setStatus("New request not saved", "unsaved");
          } else if (
            !isSaving &&
            mobileFormMode === "create" &&
            isMobileFormDirty()
          ) {
            setStatus("New request not saved", "unsaved");
          } else if (!isSaving && hasDraftRow()) {
            setStatus("New row not saved", "unsaved");
          } else if (!isSaving && count > 0) {
            setStatus(
              count + (count === 1 ? " unsaved change" : " unsaved changes"),
              "unsaved"
            );
          } else if (
            !isSaving &&
            statusElement.classList.contains("unsaved")
          ) {
            setStatus("");
          }
        }

        function textFormatter(cell) {
          var value = cell.getValue();
          var row = cell.getRow().getData();
          var columnOffset = Number(cell.getColumn().getField().substring(1));
          var link = row._links[columnOffset] || "";
          var displayValue =
            value === null || value === undefined ? "" : String(value);
          if (!link) {
            var text = document.createElement("span");
            text.className = "request-cell-content";
            text.textContent = displayValue;
            return text;
          }

          var anchor = document.createElement("a");
          anchor.href = link;
          anchor.target = "_blank";
          anchor.rel = "noopener";
          anchor.className = "request-link request-cell-content";
          anchor.textContent =
            row["_display" + columnOffset] || displayValue || link;
          anchor.addEventListener("click", function (event) {
            event.stopPropagation();
          });
          return anchor;
        }

        function newRowProjectSelectFormatter(cell) {
          var select = document.createElement("select");
          select.className = "new-row-input new-row-select";
          select.setAttribute("aria-label", "Project *");

          var placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "Project *";
          select.appendChild(placeholder);

          projectOptions.forEach(function (project) {
            var option = document.createElement("option");
            option.value = project;
            option.textContent = project;
            select.appendChild(option);
          });

          select.value = cell.getValue() || "";
          select.addEventListener("change", function () {
            cell.getRow().getData().c0 = select.value;
            cell
              .getElement()
              .classList.remove("is-required-missing");
          });
          ["mousedown", "click", "dblclick"].forEach(function (eventName) {
            select.addEventListener(eventName, function (event) {
              event.stopPropagation();
            });
          });
          return select;
        }

        function newRowInputFormatter(cell) {
          var columnOffset = Number(cell.getColumn().getField().substring(1));
          if (columnOffset === PROJECT_OFFSET) {
            return newRowProjectSelectFormatter(cell);
          }
          var input = document.createElement("textarea");
          input.className = "new-row-input";
          input.rows = 2;
          input.value = cell.getValue() || "";
          input.placeholder =
            columnOffset === DETAILS_OFFSET
              ? "Details *"
              : fallbackHeaders[columnOffset];
          input.setAttribute("aria-label", input.placeholder);
          input.addEventListener("input", function () {
            cell.getRow().getData()["c" + columnOffset] = input.value;
            if (columnOffset === DETAILS_OFFSET) {
              cell
                .getElement()
                .classList.remove("is-required-missing");
            }
          });
          ["mousedown", "click", "dblclick"].forEach(function (eventName) {
            input.addEventListener(eventName, function (event) {
              event.stopPropagation();
            });
          });
          return input;
        }

        function checkboxFormatter(cell) {
          if (cell.getRow().getData()._isNew) {
            var draftElement = cell.getElement();
            draftElement.classList.remove(
              "is-checked",
              "is-unchecked",
              "is-not-applicable"
            );
            draftElement.classList.add("is-new-row-empty");
            return "";
          }
          var status = cell.getValue();
          if (status === true) status = "checked";
          if (status === false || status === "") status = "unchecked";
          var element = cell.getElement();
          element.classList.remove("is-new-row-empty");
          element.classList.toggle("is-checked", status === "checked");
          element.classList.toggle("is-unchecked", status === "unchecked");
          element.classList.toggle(
            "is-not-applicable",
            status === "notApplicable"
          );

          var icon = document.createElement("i");
          if (status === "checked") {
            icon.className = "bi bi-check-square-fill";
            icon.setAttribute("aria-label", "Checked");
            icon.title = "Checked";
          } else if (status === "notApplicable") {
            icon.className = "bi bi-dash-square-fill";
            icon.setAttribute("aria-label", "Not applicable");
            icon.title = "Not applicable";
          } else {
            icon.className = "bi bi-square";
            icon.setAttribute("aria-label", "Unchecked");
            icon.title = "Unchecked";
          }
          return icon;
        }

        function newRowActionsFormatter(cell) {
          if (!cell.getRow().getData()._isNew) return "";

          var wrapper = document.createElement("div");
          wrapper.className = "new-row-actions";
          var rowIsSaving = cell.getRow().getData()._isSaving === true;

          var saveRowButton = document.createElement("button");
          saveRowButton.type = "button";
          saveRowButton.className =
            "btn btn-sm btn-success save-new-row-btn";
          saveRowButton.title = "Save row";
          saveRowButton.setAttribute("aria-label", "Save row");
          saveRowButton.disabled = rowIsSaving;
          saveRowButton.innerHTML = rowIsSaving
            ? '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>'
            : '<i class="bi bi-check-lg"></i>';
          saveRowButton.addEventListener("mousedown", function (event) {
            event.preventDefault();
            event.stopPropagation();
          });
          saveRowButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            saveNewRow(cell.getRow());
          });

          var cancelRowButton = document.createElement("button");
          cancelRowButton.type = "button";
          cancelRowButton.className =
            "btn btn-sm btn-outline-danger cancel-new-row-btn";
          cancelRowButton.title = "Cancel new row";
          cancelRowButton.setAttribute("aria-label", "Cancel new row");
          cancelRowButton.disabled = rowIsSaving;
          cancelRowButton.innerHTML = '<i class="bi bi-x-lg"></i>';
          cancelRowButton.addEventListener("mousedown", function (event) {
            event.preventDefault();
            event.stopPropagation();
          });
          cancelRowButton.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();
            cancelNewRow(cell.getRow());
          });

          wrapper.appendChild(saveRowButton);
          wrapper.appendChild(cancelRowButton);
          return wrapper;
        }

        function buildColumns(headers) {
          var columns = fallbackHeaders.map(function (
            fallbackHeader,
            columnOffset
          ) {
            var header = headers[columnOffset] || fallbackHeader;
            var checkboxColumn = isStatusColumn(columnOffset);
            var readOnlyColumn = isReadOnlyColumn(columnOffset);
            var projectColumn = columnOffset === PROJECT_OFFSET;
            var textWidth = textColumnWidths[columnOffset] || 120;
            var cssClasses = [];
            if (checkboxColumn) cssClasses.push("invoice-checkbox-cell");
            if (isStatusGroupBoundary(columnOffset)) {
              cssClasses.push("status-group-boundary");
            }
            if (
              columnOffset === DETAILS_OFFSET ||
              columnOffset === COMMENT_OFFSET ||
              columnOffset === RATE_FILE_OFFSET
            ) {
              cssClasses.push("scrollable-text-cell");
            }
            var column = {
              title: header,
              field: "c" + columnOffset,
              headerHozAlign: "center",
              headerSort: true,
              editable: checkboxColumn || readOnlyColumn
                ? false
                : function (cell) {
                    return (
                      !hasDraftRow() &&
                      cell.getRow().getData()._isNew !== true
                    );
                  },
              minWidth: checkboxColumn ? 66 : textWidth,
              width: checkboxColumn ? 70 : textWidth,
              variableHeight: !checkboxColumn,
              cssClass: cssClasses.join(" "),
              headerCssClass: isStatusGroupBoundary(columnOffset)
                ? "status-group-boundary"
                : "",
              formatter: checkboxColumn
                ? checkboxFormatter
                : function (cell) {
                    if (
                      cell.getRow().getData()._isNew &&
                      isDraftInputColumn(columnOffset)
                    ) {
                      return newRowInputFormatter(cell);
                    }
                    return textFormatter(cell);
                  },
              editor: checkboxColumn || readOnlyColumn
                ? false
                : projectColumn
                ? "list"
                : "textarea",
              editorParams: checkboxColumn || readOnlyColumn
                ? {
                    tristate: false,
                  }
                : projectColumn
                ? {
                    values: projectOptions,
                    autocomplete: true,
                    listOnEmpty: true,
                    freetext: false,
                    emptyValue: "",
                  }
                : {
                    verticalNavigation: "table",
                    shiftEnterSubmit: true,
                  },
              headerFilter:
                columnOffset === PROJECT_OFFSET ||
                columnOffset === AUTHOR_OFFSET
                  ? "input"
                  : false,
              headerFilterPlaceholder: "Search",
              headerSortTristate: true,
            };

            if (isTimestampColumn(columnOffset)) {
              column.sorter = ddMmSorter;
            }

            if (columnOffset === AUTHOR_OFFSET && !showAuthorColumn) {
              column.visible = false;
            }

            if (checkboxColumn) {
              if (!showStatusColumns) {
                column.visible = false;
              }
              column.cellClick = function (event, cell) {
                event.preventDefault();
                if (!showStatusColumns) return;
                if (cell.getRow().getData()._isNew) return;
                if (
                  hasDraftRow() &&
                  cell.getRow().getData()._isNew !== true
                ) {
                  return;
                }
                var currentStatus = cell.getValue();
                var nextStatus =
                  currentStatus === "unchecked"
                    ? "checked"
                    : currentStatus === "checked"
                    ? "notApplicable"
                    : "unchecked";
                cell.setValue(nextStatus);
                trackCellChange(cell);
              };
            }
            if (columnOffset === 0) column.frozen = true;
            return column;
          });

          columns.push({
            title: "",
            field: "_activityAt",
            visible: false,
            headerSort: true,
            sorter: "number",
          });
          columns.push({
            title: "",
            field: "_rowActions",
            width: 78,
            minWidth: 78,
            frozen: true,
            visible: false,
            headerSort: false,
            hozAlign: "center",
            formatter: newRowActionsFormatter,
          });
          return columns;
        }

        function tableRows(response) {
          return (response.rows || [])
            .map(function (sourceRow) {
              var row = {
                _id: sourceRow.id,
                _activityAt: Number(sourceRow.activityAt) || 0,
                _links: [],
                _original: [],
                _originalTokens: [],
              };
              (sourceRow.cells || []).forEach(function (cell, columnOffset) {
                row["c" + columnOffset] = cell.value;
                row["_display" + columnOffset] = cell.displayValue;
                row._links[columnOffset] = cell.link || "";
                row._original[columnOffset] = cell.value;
                row._originalTokens[columnOffset] = cell.originalToken;
              });
              if (!row._activityAt) {
                row._activityAt = rowActivityAt(row);
              }
              return row;
            })
            .sort(function (left, right) {
              return (right._activityAt || 0) - (left._activityAt || 0);
            });
        }

        function applyHeaderColors() {
          if (!table) return;
          table.getColumns().forEach(function (column, index) {
            var element = column.getElement();
            if (!element) return;
            element.style.backgroundColor =
              headerColors[index] || "#f1f3f5";
          });
        }

        function buildTable(response) {
          if (table) table.destroy();
          tableTopOffset = tableElement.getBoundingClientRect().top;
          table = new Tabulator(tableElement, {
            index: "_id",
            height: tableHeight(),
            layout: "fitColumns",
            editTriggerEvent: "dblclick",
            placeholder: "No invoice requests found",
            pagination: true,
            paginationMode: "local",
            paginationSize: 25,
            paginationSizeSelector: [10, 25, 50, 100, true],
            initialSort: [{ column: "_activityAt", dir: "desc" }],
            columns: buildColumns(response.headers || []),
            data: tableRows(response),
            rowFormatter: function (row) {
              row.getElement().style.minHeight = "34px";
              row
                .getElement()
                .classList.toggle(
                  "is-new-row",
                  row.getData()._isNew === true
                );
            },
          });
          table.on("tableBuilt", function () {
            applyHeaderColors();
            table.setSort([{ column: "_activityAt", dir: "desc" }]);
          });
          table.on("cellEdited", trackCellChange);
        }

        function trackCellChange(cell) {
          var row = cell.getRow().getData();
          var columnOffset = Number(cell.getColumn().getField().substring(1));
          if (row._isNew) {
            if (
              columnOffset === PROJECT_OFFSET ||
              columnOffset === DETAILS_OFFSET
            ) {
              cell
                .getElement()
                .classList.remove("is-required-missing");
            }
            updateToolbar();
            return;
          }
          if (isStatusColumn(columnOffset) && !showStatusColumns) {
            return;
          }
          var originalValue = row._original[columnOffset];
          var currentValue = cell.getValue();
          var key = changeKey(row._id, columnOffset);
          var changed =
            JSON.stringify(currentValue) !== JSON.stringify(originalValue);

          if (changed) {
            dirtyChanges[key] = {
              id: row._id,
              columnOffset: columnOffset,
              originalToken: row._originalTokens[columnOffset],
              value: currentValue,
            };
          } else {
            delete dirtyChanges[key];
          }
          cell.getElement().classList.toggle("is-dirty", changed);
          if (isStatusColumn(columnOffset)) checkboxFormatter(cell);
          updateToolbar();
        }

        function setLoading(loading) {
          reloadButton.disabled = loading || isSaving;
          addRowButton.disabled =
            loading ||
            isSaving ||
            dirtyCount() > 0 ||
            hasDraftRow() ||
            hasOpenCreateOrEditForm();
          reloadButton.querySelector("i").className = loading
            ? "spinner-border spinner-border-sm me-1"
            : "bi bi-arrow-clockwise me-1";
        }

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function mobileFieldHtml(label, valueHtml) {
          return (
            '<div class="invoice-mobile-card-field">' +
            '<span class="invoice-mobile-card-label">' +
            escapeHtml(label) +
            "</span>" +
            '<div class="invoice-mobile-card-value">' +
            valueHtml +
            "</div></div>"
          );
        }

        function fillSelectOptions(selectElement, selected) {
          selectElement.innerHTML = "";
          var placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = "Project *";
          selectElement.appendChild(placeholder);
          projectOptions.forEach(function (project) {
            var option = document.createElement("option");
            option.value = project;
            option.textContent = project;
            selectElement.appendChild(option);
          });
          selectElement.value = selected || "";
        }

        function fillMobileProjectOptions(selected) {
          fillSelectOptions(mobileProjectField, selected);
        }

        function buildCreateCellsFromForm(projectField, detailsField, commentField) {
          var cells = [];
          for (var i = 0; i < fallbackHeaders.length; i++) cells.push("");
          cells[PROJECT_OFFSET] = String(projectField.value || "").trim();
          cells[DETAILS_OFFSET] = String(detailsField.value || "").trim();
          cells[COMMENT_OFFSET] = String(commentField.value || "");
          return cells;
        }

        function validateCreateForm(projectField, detailsField) {
          var projectValue = String(projectField.value || "").trim();
          var detailsMissing =
            String(detailsField.value || "").trim() === "";
          var projectMissing = projectValue === "";
          var projectInvalid =
            !projectMissing && projectOptions.indexOf(projectValue) === -1;
          projectField.classList.toggle(
            "is-invalid",
            projectMissing || projectInvalid
          );
          detailsField.classList.toggle("is-invalid", detailsMissing);
          if (projectInvalid) {
            setStatus("Select a project from the list", "error");
            return false;
          }
          if (projectMissing || detailsMissing) {
            setStatus("Project and Details are required", "error");
            return false;
          }
          return true;
        }

        function openDesktopCreateOverlay() {
          desktopCreateOpen = true;
          desktopCreateBaseline = {
            project: "",
            details: "",
            comment: "",
          };
          fillSelectOptions(desktopProjectField, "");
          desktopDetailsField.value = "";
          desktopCommentField.value = "";
          desktopProjectField.classList.remove("is-invalid");
          desktopDetailsField.classList.remove("is-invalid");
          updateToolbar();
          createInvoiceModal.show();
          setTimeout(function () {
            desktopProjectField.focus();
          }, 200);
        }

        function closeDesktopCreateOverlay() {
          desktopCreateOpen = false;
          desktopCreateBaseline = null;
          desktopProjectField.classList.remove("is-invalid");
          desktopDetailsField.classList.remove("is-invalid");
          createInvoiceModal.hide();
          updateToolbar();
        }

        function requestCloseDesktopCreateOverlay() {
          confirmDiscard(function () {
            closeDesktopCreateOverlay();
            setStatus("");
          });
        }

        function setDesktopCreateBusy(busy) {
          createInvoiceSaveButton.disabled = busy;
          createInvoiceCancelButton.disabled = busy;
          createInvoiceDismissButton.disabled = busy;
          desktopProjectField.disabled = busy;
          desktopDetailsField.disabled = busy;
          desktopCommentField.disabled = busy;
          createInvoiceSaveButton.innerHTML = busy
            ? '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>'
            : "Save";
        }

        function saveDesktopCreateOverlay() {
          if (isSaving || !desktopCreateOpen) return;
          if (!validateCreateForm(desktopProjectField, desktopDetailsField)) {
            return;
          }

          isSaving = true;
          setDesktopCreateBusy(true);
          setStatus("Saving new row…");
          updateToolbar();

          google.script.run
            .withSuccessHandler(function (result) {
              isSaving = false;
              setDesktopCreateBusy(false);
              if (!result || !result.success) {
                updateToolbar();
                setStatus(
                  (result && result.message) || "Could not save new row",
                  "error"
                );
                return;
              }
              desktopCreateOpen = false;
              desktopCreateBaseline = null;
              createInvoiceModal.hide();
              if (result.rows) {
                applyLoadedData(result);
              } else {
                loadData(true);
              }
              setStatus("New row saved", "success");
              updateToolbar();
            })
            .withFailureHandler(function (error) {
              console.error("Desktop create failed:", error);
              isSaving = false;
              setDesktopCreateBusy(false);
              updateToolbar();
              setStatus(
                (error && error.message) || "Could not save new row",
                "error"
              );
            })
            .createInvoiceRequest({
              cells: buildCreateCellsFromForm(
                desktopProjectField,
                desktopDetailsField,
                desktopCommentField
              ),
            });
        }

        function closeMobileForm() {
          mobileFormMode = null;
          mobileEditRow = null;
          mobileFormBaseline = null;
          mobileFormElement.classList.add("d-none");
          mobileListElement.classList.remove("d-none");
          mobileProjectField.classList.remove("is-invalid");
          mobileDetailsField.classList.remove("is-invalid");
          updateToolbar();
        }

        function openMobileForm(mode, row) {
          mobileFormMode = mode;
          mobileEditRow = row || null;
          mobileFormTitle.textContent =
            mode === "edit" ? "Edit invoice request" : "New invoice request";
          var project = row ? String(row.c0 || "") : "";
          var details = row ? String(row.c1 || "") : "";
          var comment = row ? String(row.c2 || "") : "";
          fillMobileProjectOptions(project);
          mobileDetailsField.value = details;
          mobileCommentField.value = comment;
          mobileFormBaseline = {
            project: project,
            details: details,
            comment: comment,
          };
          mobileProjectField.classList.remove("is-invalid");
          mobileDetailsField.classList.remove("is-invalid");
          mobileFormElement.classList.remove("d-none");
          mobileListElement.classList.add("d-none");
          updateToolbar();
          mobileProjectField.focus();
        }

        function renderMobileList(response) {
          var rows = tableRows(response || { rows: [] });
          if (!rows.length) {
            mobileListElement.innerHTML =
              '<div class="invoice-mobile-empty">No invoice requests found</div>';
            return;
          }

          mobileListElement.innerHTML = rows
            .map(function (row) {
              var rateValue = String(
                row["_display" + RATE_FILE_OFFSET] ||
                  row["c" + RATE_FILE_OFFSET] ||
                  ""
              );
              var rateLink = row._links[RATE_FILE_OFFSET] || "";
              var rateHtml = rateLink
                ? '<a class="request-link" href="' +
                  escapeHtml(rateLink) +
                  '" target="_blank" rel="noopener">' +
                  escapeHtml(rateValue || rateLink) +
                  "</a>"
                : escapeHtml(rateValue);

              return (
                '<article class="invoice-mobile-card" data-row-id="' +
                escapeHtml(row._id) +
                '">' +
                mobileFieldHtml("Проект", escapeHtml(row.c0 || "")) +
                mobileFieldHtml("Дані", escapeHtml(row.c1 || "")) +
                mobileFieldHtml("Комент", escapeHtml(row.c2 || "")) +
                mobileFieldHtml("Файл рейтів", rateHtml || "&nbsp;") +
                mobileFieldHtml(
                  "Created by",
                  escapeHtml(row.c13 || "")
                ) +
                mobileFieldHtml(
                  "Created at",
                  escapeHtml(row.c14 || "")
                ) +
                mobileFieldHtml(
                  "Edited by",
                  escapeHtml(row.c15 || "")
                ) +
                mobileFieldHtml(
                  "Edited at",
                  escapeHtml(row.c16 || "")
                ) +
                '<div class="invoice-mobile-card-actions">' +
                '<button type="button" class="btn btn-outline-primary w-100 mobile-edit-btn">' +
                "Edit</button></div></article>"
              );
            })
            .join("");
        }

        function renderCurrentView() {
          var mobile = useMobileLimitedUi();
          document.body.classList.toggle("invoice-mobile-limited", mobile);
          if (mobile) {
            if (table) {
              table.destroy();
              table = null;
            }
            if (mobileFormMode) {
              fillMobileProjectOptions(mobileProjectField.value);
              mobileFormElement.classList.remove("d-none");
              mobileListElement.classList.add("d-none");
            } else {
              mobileFormElement.classList.add("d-none");
              mobileListElement.classList.remove("d-none");
              renderMobileList(lastLoadedResponse || { rows: [] });
            }
          } else {
            if (mobileFormMode) {
              closeMobileForm();
            }
            buildTable(
              lastLoadedResponse || { headers: [], rows: [], projects: [] }
            );
          }
          updateToolbar();
        }

        function validateMobileForm() {
          return validateCreateForm(mobileProjectField, mobileDetailsField);
        }

        function setMobileFormBusy(busy) {
          mobileFormSaveButton.disabled = busy;
          mobileFormCancelButton.disabled = busy;
          mobileProjectField.disabled = busy;
          mobileDetailsField.disabled = busy;
          mobileCommentField.disabled = busy;
          mobileFormSaveButton.innerHTML = busy
            ? '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>'
            : "Save";
        }

        function saveMobileForm() {
          if (isSaving || !mobileFormMode) return;
          if (!validateMobileForm()) return;

          if (mobileFormMode === "create") {
            isSaving = true;
            setMobileFormBusy(true);
            setStatus("Saving new row…");
            updateToolbar();

            google.script.run
              .withSuccessHandler(function (result) {
                isSaving = false;
                setMobileFormBusy(false);
                if (!result || !result.success) {
                  updateToolbar();
                  setStatus(
                    (result && result.message) || "Could not save new row",
                    "error"
                  );
                  return;
                }
                mobileFormMode = null;
                mobileEditRow = null;
                mobileFormBaseline = null;
                if (result.rows) {
                  applyLoadedData(result);
                } else {
                  loadData(true);
                }
                setStatus("New row saved", "success");
                updateToolbar();
              })
              .withFailureHandler(function (error) {
                console.error("Mobile create failed:", error);
                isSaving = false;
                setMobileFormBusy(false);
                updateToolbar();
                setStatus(
                  (error && error.message) || "Could not save new row",
                  "error"
                );
              })
              .createInvoiceRequest({
                cells: buildCreateCellsFromForm(
                  mobileProjectField,
                  mobileDetailsField,
                  mobileCommentField
                ),
              });
            return;
          }

          if (!mobileEditRow) return;
          var nextProject = String(mobileProjectField.value || "").trim();
          var nextDetails = String(mobileDetailsField.value || "").trim();
          var nextComment = String(mobileCommentField.value || "");
          var changes = [];
          [
            [PROJECT_OFFSET, nextProject],
            [DETAILS_OFFSET, nextDetails],
            [COMMENT_OFFSET, nextComment],
          ].forEach(function (pair) {
            var columnOffset = pair[0];
            var value = pair[1];
            if (
              JSON.stringify(value) !==
              JSON.stringify(mobileEditRow._original[columnOffset])
            ) {
              changes.push({
                id: mobileEditRow._id,
                columnOffset: columnOffset,
                originalToken: mobileEditRow._originalTokens[columnOffset],
                value: value,
              });
            }
          });

          if (!changes.length) {
            closeMobileForm();
            renderMobileList(lastLoadedResponse || { rows: [] });
            setStatus("");
            return;
          }

          isSaving = true;
          setMobileFormBusy(true);
          setStatus("Saving…");
          updateToolbar();

          google.script.run
            .withSuccessHandler(function (result) {
              isSaving = false;
              setMobileFormBusy(false);
              if (!result || !result.success) {
                updateToolbar();
                setStatus(
                  (result && result.message) || "Save failed",
                  "error"
                );
                return;
              }
              mobileFormMode = null;
              mobileEditRow = null;
              mobileFormBaseline = null;
              if (result.rows) {
                applyLoadedData(result);
              } else {
                loadData(true);
              }
              setStatus("Saved", "success");
              updateToolbar();
            })
            .withFailureHandler(function (error) {
              console.error("Mobile save failed:", error);
              isSaving = false;
              setMobileFormBusy(false);
              updateToolbar();
              setStatus(
                (error && error.message) || "Save failed. Try again.",
                "error"
              );
            })
            .saveInvoiceRequestChanges(changes);
        }

        function applyLoadedData(response) {
          dirtyChanges = {};
          draftRowId = null;
          mobileFormMode = null;
          mobileEditRow = null;
          mobileFormBaseline = null;
          desktopCreateOpen = false;
          desktopCreateBaseline = null;
          if (
            createInvoiceModalElement.classList.contains("show")
          ) {
            createInvoiceModal.hide();
          }
          lastLoadedResponse = response || {
            headers: [],
            rows: [],
            projects: [],
          };
          projectOptions = lastLoadedResponse.projects || [];
          showStatusColumns = !(
            response && response.showStatusColumns === false
          );
          showAuthorColumn = !(
            response && response.showAuthorColumn === false
          );
          // Prefer accessMode; also treat hidden status columns as limited
          // so card UI still appears if accessMode is missing in the payload.
          isLimitedAccess = !!(
            response &&
            (response.accessMode === "limited" ||
              response.showStatusColumns === false)
          );
          renderCurrentView();
        }

        function loadData(force) {
          if (hasUnsavedWork() && !force) return;
          setLoading(true);
          errorElement.classList.add("d-none");
          errorElement.textContent = "";
          setStatus("");

          google.script.run
            .withSuccessHandler(function (response) {
              applyLoadedData(response);
              setLoading(false);
              setStatus("");
            })
            .withFailureHandler(function (error) {
              console.error("Invoice Requests load failed:", error);
              errorElement.textContent =
                (error && error.message) || "Failed to load invoice requests.";
              errorElement.classList.remove("d-none");
              setLoading(false);
              setStatus("Load failed", "error");
            })
            .getInvoiceRequests();
        }

        function addNewRow() {
          if (
            isSaving ||
            dirtyCount() > 0 ||
            hasDraftRow() ||
            hasOpenCreateOrEditForm()
          ) {
            return;
          }
          if (useMobileLimitedUi()) {
            openMobileForm("create");
            return;
          }
          if (USE_DESKTOP_CREATE_OVERLAY) {
            openDesktopCreateOverlay();
            return;
          }
          addNewRowInline();
        }

        // Legacy path: create as an editable draft row inside Tabulator.
        // Kept for easy rollback via USE_DESKTOP_CREATE_OVERLAY = false.
        function addNewRowInline() {
          if (!table) return;

          draftRowId = "new-" + Date.now();
          table.getColumn("_rowActions").show();
          var draft = {
            _id: draftRowId,
            _isNew: true,
            _activityAt: Date.now(),
            _links: [],
            _original: [],
            _originalTokens: [],
          };
          for (
            var columnOffset = 0;
            columnOffset < fallbackHeaders.length;
            columnOffset++
          ) {
            draft["c" + columnOffset] = "";
          }

          table.addRow(draft, true).then(function (row) {
            row.scrollTo();
            var projectInput = row
              .getCell("c0")
              .getElement()
              .querySelector(".new-row-select, .new-row-input");
            if (projectInput) projectInput.focus();
            updateToolbar();
          });
          updateToolbar();
        }

        function draftCells(row) {
          var data = row.getData();
          return fallbackHeaders.map(function (_header, columnOffset) {
            return data["c" + columnOffset];
          });
        }

        function validateNewRow(row) {
          var projectCell = row.getCell("c0");
          var detailsCell = row.getCell("c1");
          var projectValue = String(row.getData().c0 || "").trim();
          var detailsMissing =
            String(row.getData().c1 || "").trim() === "";
          var projectMissing = projectValue === "";
          var projectInvalid =
            !projectMissing && projectOptions.indexOf(projectValue) === -1;
          projectCell
            .getElement()
            .classList.toggle(
              "is-required-missing",
              projectMissing || projectInvalid
            );
          detailsCell
            .getElement()
            .classList.toggle("is-required-missing", detailsMissing);
          if (projectInvalid) {
            setStatus("Select a project from the list", "error");
            return false;
          }
          return !projectMissing && !detailsMissing;
        }

        function setNewRowBusy(row, busy) {
          row.getData()._isSaving = busy;
          row
            .getElement()
            .classList.toggle("is-saving-new-row", busy);
          row
            .getElement()
            .querySelectorAll("textarea, select, button")
            .forEach(function (control) {
              control.disabled = busy;
            });

          var saveRowButton = row
            .getElement()
            .querySelector(".save-new-row-btn");
          if (saveRowButton) {
            saveRowButton.innerHTML = busy
              ? '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>'
              : '<i class="bi bi-check-lg"></i>';
          }
        }

        function saveNewRow(row) {
          if (isSaving || !row || row.getData()._isNew !== true) return;
          if (!validateNewRow(row)) {
            setStatus("Project and Details are required", "error");
            return;
          }

          isSaving = true;
          setNewRowBusy(row, true);
          setStatus("Saving new row…");
          updateToolbar();

          google.script.run
            .withSuccessHandler(function (result) {
              isSaving = false;
              if (!result || !result.success) {
                setNewRowBusy(row, false);
                updateToolbar();
                setStatus(
                  (result && result.message) || "Could not save new row",
                  "error"
                );
                return;
              }
              draftRowId = null;
              if (result.rows) {
                applyLoadedData(result);
              } else {
                loadData(true);
              }
              setStatus("New row saved", "success");
              updateToolbar();
            })
            .withFailureHandler(function (error) {
              console.error("Invoice Request row creation failed:", error);
              isSaving = false;
              setNewRowBusy(row, false);
              updateToolbar();
              setStatus(
                (error && error.message) || "Could not save new row",
                "error"
              );
            })
            .createInvoiceRequest({ cells: draftCells(row) });
        }

        function cancelNewRow(row) {
          if (!row || row.getData()._isNew !== true) return;
          confirmDiscard(function () {
            draftRowId = null;
            row.delete();
            table.getColumn("_rowActions").hide();
            setStatus("");
            updateToolbar();
          });
        }

        function saveChanges() {
          var changes = Object.keys(dirtyChanges).map(function (key) {
            return dirtyChanges[key];
          });
          if (changes.length === 0 || isSaving) return;

          isSaving = true;
          saveButton.querySelector("i").className =
            "spinner-border spinner-border-sm me-1";
          setStatus("Saving…");
          updateToolbar();

          google.script.run
            .withSuccessHandler(function (result) {
              isSaving = false;
              saveButton.querySelector("i").className = "bi bi-floppy me-1";
              if (!result || !result.success) {
                updateToolbar();
                setStatus(
                  (result && result.message) || "Save failed",
                  "error"
                );
                return;
              }

              if (result.rows) {
                applyLoadedData(result);
              } else {
                dirtyChanges = {};
                loadData(true);
              }
              setStatus("Saved", "success");
              updateToolbar();
            })
            .withFailureHandler(function (error) {
              console.error("Invoice Requests save failed:", error);
              isSaving = false;
              saveButton.querySelector("i").className = "bi bi-floppy me-1";
              updateToolbar();
              setStatus(
                (error && error.message) || "Save failed. Try again.",
                "error"
              );
            })
            .saveInvoiceRequestChanges(changes);
        }

        function confirmDiscard(action) {
          if (!hasUnsavedWork()) {
            action();
            return;
          }
          pendingDiscardAction = action;
          unsavedModal.show();
        }

        addRowButton.addEventListener("click", addNewRow);
        saveButton.addEventListener("click", saveChanges);
        reloadButton.addEventListener("click", function () {
          confirmDiscard(function () {
            loadData(true);
          });
        });
        mobileFormSaveButton.addEventListener("click", saveMobileForm);
        mobileFormCancelButton.addEventListener("click", function () {
          confirmDiscard(function () {
            closeMobileForm();
            renderMobileList(lastLoadedResponse || { rows: [] });
            setStatus("");
          });
        });
        mobileListElement.addEventListener("click", function (event) {
          var editButton = event.target.closest(".mobile-edit-btn");
          if (!editButton || isSaving || mobileFormMode) return;
          var card = editButton.closest(".invoice-mobile-card");
          if (!card) return;
          var rowId = card.getAttribute("data-row-id");
          var rows = tableRows(lastLoadedResponse || { rows: [] });
          var row = null;
          for (var i = 0; i < rows.length; i++) {
            if (rows[i]._id === rowId) {
              row = rows[i];
              break;
            }
          }
          if (row) openMobileForm("edit", row);
        });
        [mobileProjectField, mobileDetailsField, mobileCommentField].forEach(
          function (field) {
            field.addEventListener("input", updateToolbar);
            field.addEventListener("change", updateToolbar);
          }
        );
        createInvoiceSaveButton.addEventListener(
          "click",
          saveDesktopCreateOverlay
        );
        createInvoiceCancelButton.addEventListener(
          "click",
          requestCloseDesktopCreateOverlay
        );
        createInvoiceDismissButton.addEventListener(
          "click",
          requestCloseDesktopCreateOverlay
        );
        [desktopProjectField, desktopDetailsField, desktopCommentField].forEach(
          function (field) {
            field.addEventListener("input", updateToolbar);
            field.addEventListener("change", updateToolbar);
          }
        );
        createInvoiceModalElement.addEventListener(
          "hidden.bs.modal",
          function () {
            if (!desktopCreateOpen) return;
            // Closed without going through our cancel helpers (e.g. programmatic).
            desktopCreateOpen = false;
            desktopCreateBaseline = null;
            updateToolbar();
          }
        );

        leaveWithoutSavingButton.addEventListener("click", function () {
          var action = pendingDiscardAction;
          pendingDiscardAction = null;
          unsavedModal.hide();
          if (action) action();
        });

        document.addEventListener(
          "click",
          function (event) {
            if (!hasUnsavedWork()) return;
            var link = event.target.closest("a[href]");
            if (
              !link ||
              link.classList.contains("request-link") ||
              link.target === "_blank" ||
              link.getAttribute("href").charAt(0) === "#"
            ) {
              return;
            }

            event.preventDefault();
            event.stopImmediatePropagation();
            var destination = link.href;
            confirmDiscard(function () {
              allowUnsavedExit = true;
              window.top.location.href = destination;
            });
          },
          true
        );

        unsavedModalElement.addEventListener("hidden.bs.modal", function () {
          pendingDiscardAction = null;
        });

        window.addEventListener("beforeunload", function (event) {
          if (!hasUnsavedWork() || allowUnsavedExit) return;
          event.preventDefault();
          event.returnValue = "";
        });

        window.addEventListener("resize", function () {
          var wantMobile = useMobileLimitedUi();
          var isMobile = document.body.classList.contains(
            "invoice-mobile-limited"
          );
          if (wantMobile !== isMobile) {
            confirmDiscard(function () {
              mobileFormMode = null;
              mobileEditRow = null;
              mobileFormBaseline = null;
              dirtyChanges = {};
              draftRowId = null;
              renderCurrentView();
              setStatus("");
            });
            return;
          }
          if (table) table.setHeight(tableHeight());
        });

        loadData(true);
      });
    </script>
  </body>
</html>
