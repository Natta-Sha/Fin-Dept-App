<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="UTF-8" />
    <title>Tabulator invoices</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/css/tabulator_bootstrap5.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-size: 0.875rem;
      }

      .main-content {
        padding: 20px;
      }

      .lab-badge {
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        vertical-align: middle;
      }

      #invoice-tabulator {
        min-height: 220px;
      }

      #invoice-tabulator .tabulator-header .tabulator-col {
        text-align: center;
      }

      #invoice-tabulator .tabulator-cell {
        padding: 6px 8px;
      }

      .invoice-actions {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.25rem;
      }

      .invoice-actions .btn {
        border-radius: 15px;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 0.25rem 0.75rem;
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <?!= getNavigation(activePage) ?>

    <main class="main-content container-fluid">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
        <div>
          <h2 class="mb-1">
            Tabulator invoices
            <span class="badge text-bg-warning lab-badge">TEST</span>
          </h2>
          <p class="mb-0 text-secondary">
            Test view using the existing invoice data source.
          </p>
        </div>
        <button
          type="button"
          id="refresh-invoices-btn"
          class="btn btn-outline-secondary"
        >
          <i class="bi bi-arrow-clockwise me-1"></i>Update
        </button>
      </div>

      <div id="invoice-load-error" class="alert alert-danger d-none" role="alert"></div>
      <div id="invoice-tabulator" aria-label="Invoice list"></div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var baseUrl = <?!= JSON.stringify(baseUrl) ?>;
        var refreshButton = document.getElementById("refresh-invoices-btn");
        var errorBox = document.getElementById("invoice-load-error");

        function parseDate(value) {
          if (!value) return 0;
          var parts = String(value).split("/");
          if (parts.length !== 3) return 0;
          return new Date(
            Number(parts[2]),
            Number(parts[1]) - 1,
            Number(parts[0])
          ).getTime();
        }

        function dateSorter(a, b) {
          return parseDate(a) - parseDate(b);
        }

        function numberSorter(a, b) {
          return (parseFloat(a) || 0) - (parseFloat(b) || 0);
        }

        function totalFormatter(cell) {
          var value = parseFloat(cell.getValue());
          if (Number.isNaN(value)) return cell.getValue() || "";
          return value.toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });
        }

        function actionsFormatter(cell) {
          var invoiceId = encodeURIComponent(cell.getRow().getData().id || "");
          var actions = document.createElement("div");
          actions.className = "invoice-actions";

          [
            ["View", "view", "btn-outline-primary"],
            ["Edit", "edit", "btn-outline-secondary"],
            ["Delete", "delete", "btn-outline-danger"],
            ["Copy", "copy", "btn-outline-success"],
          ].forEach(function (action) {
            var link = document.createElement("a");
            link.href =
              baseUrl +
              "?page=InvoiceGenerator&id=" +
              invoiceId +
              "&mode=" +
              action[1];
            link.className = "btn btn-sm " + action[2];
            link.textContent = action[0];
            actions.appendChild(link);
          });

          return actions;
        }

        var table = new Tabulator("#invoice-tabulator", {
          layout: "fitColumns",
          placeholder: "No invoices found",
          pagination: true,
          paginationMode: "local",
          paginationSize: 25,
          paginationSizeSelector: [10, 25, 50, 100, true],
          initialSort: [{ column: "invoiceDate", dir: "desc" }],
          columns: [
            {
              title: "Project Name",
              field: "projectName",
              minWidth: 180,
              headerFilter: "input",
            },
            {
              title: "Invoice Number",
              field: "invoiceNumber",
              minWidth: 130,
              headerFilter: "input",
            },
            {
              title: "Invoice Date",
              field: "invoiceDate",
              minWidth: 130,
              sorter: dateSorter,
              headerFilter: "input",
            },
            {
              title: "Due Date",
              field: "dueDate",
              minWidth: 130,
              sorter: dateSorter,
              headerFilter: "input",
            },
            {
              title: "Total",
              field: "total",
              minWidth: 120,
              hozAlign: "right",
              sorter: numberSorter,
              formatter: totalFormatter,
              headerFilter: "input",
            },
            {
              title: "Currency",
              field: "currency",
              minWidth: 105,
              headerFilter: "input",
            },
            {
              title: "Actions",
              field: "id",
              minWidth: 330,
              headerSort: false,
              formatter: actionsFormatter,
            },
          ],
        });

        function setLoading(isLoading) {
          refreshButton.disabled = isLoading;
          refreshButton.querySelector("i").className = isLoading
            ? "spinner-border spinner-border-sm me-1"
            : "bi bi-arrow-clockwise me-1";
        }

        function loadInvoices(forceRefresh) {
          setLoading(true);
          errorBox.classList.add("d-none");
          errorBox.textContent = "";

          google.script.run
            .withSuccessHandler(function (data) {
              table.setData(Array.isArray(data) ? data : []);
              setLoading(false);
            })
            .withFailureHandler(function (error) {
              console.error("Error loading invoice list:", error);
              errorBox.textContent = "Failed to load invoice list.";
              errorBox.classList.remove("d-none");
              setLoading(false);
            })
            .getInvoiceList(forceRefresh === true);
        }

        refreshButton.addEventListener("click", function () {
          loadInvoices(true);
        });

        loadInvoices(false);
      });
    </script>
  </body>
</html>
